[project]
name = "project-context-compiler"
version = "0.1.0"
description = "Deterministic compiler for assembling bounded, policy-governed context for AI model invocations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ernan Hughes" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "build>=1"]

[project.scripts]
context-compiler = "context_compiler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_compiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
